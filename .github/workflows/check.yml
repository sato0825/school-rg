name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Preserve failed normal-run diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: normal-run-diagnostics-${{ github.run_id }}
          path: test-results/**/normal-run-diagnostic*.json
          if-no-files-found: ignore
          retention-days: 7
