<!doctype html><html lang="ja"><meta charset="utf-8"><title>#309 potion size and meaning QA</title>
<style>*{box-sizing:border-box}body{margin:0;background:#1d3045;color:#ebf3f5;font:13px system-ui,sans-serif}.board{width:1024px;min-height:850px;padding:24px;background:linear-gradient(#263e56,#1d3045)}h1{font-size:20px;margin:0 0 8px}h2{font-size:14px;margin:22px 0 8px;color:#bde3e5}.note{margin:0;color:#d2dee3}.tray{display:flex;gap:8px;align-items:start}.slot{width:72px;text-align:center}.icon{display:grid;place-items:center;margin:0 auto 4px;background:#dfeaf0;border:1px solid #8da9b8;border-radius:8px}.icon img{width:100%;height:100%;object-fit:contain}.small .icon{width:48px;height:48px}.medium .icon{width:64px;height:64px}.slot span{font-size:10px}.gray{filter:grayscale(1)}.detail{display:flex;gap:16px;flex-wrap:wrap}.art-only .slot span,.art-only .panel strong,.art-only .panel p{visibility:hidden}.text-only img{visibility:hidden}.panel{width:220px;padding:12px;background:#e8eff2;border:1px solid #9db4bf;border-radius:9px;color:#193249}.panel img{display:block;width:128px;height:128px;object-fit:contain;margin:0 auto 10px}.panel strong{display:block;font-size:14px}.panel p{margin:5px 0;font-size:11px}.low{background:#eff2f3;color:#182e3b}.low .icon{background:#f4f5f5}</style>
<div class="board"><h1>#309 ポーション6点 小サイズ・意味監査</h1><p class="note">候補原画。画像のみ／文字のみを切り替え、物体の性質と対象・効果を別々に確認する。実ゲームHUDは未統合。</p><h2>48px ポーション欄を想定</h2><div id="small" class="tray small"></div><h2>64px 選択画面を想定</h2><div id="medium" class="tray medium"></div><h2>48px グレースケール・低刺激</h2><div id="gray" class="tray small gray low"></div><h2>128px 詳細と効果文</h2><div id="detail" class="detail"></div><p class="note">色・絵だけで効果を確定させず、名前と効果を隣に表示。レアリティ表現は未決定。</p></div>
<script>const items=[{id:'potion-time',name:'時間の小瓶',effect:'入力時間を追加',file:'assets/potion-time-v1.png'},{id:'potion-heal',name:'保健室の包帯',effect:'HP回復',file:'assets/potion-heal-v1.png'},{id:'potion-ink',name:'インクの小瓶',effect:'敵1体にダメージ',file:'reference/potion-ink-v1.png'},{id:'potion-guard',name:'厚紙の盾',effect:'防御を得る',file:'assets/potion-guard-v1.png'},{id:'potion-splash',name:'色水の小瓶',effect:'敵全体にダメージ',file:'assets/potion-splash-v1.png'},{id:'potion-tea',name:'温かいお茶',effect:'HP回復・時間追加',file:'assets/potion-tea-v1.png'}];for(const target of ['small','medium','gray'])for(const item of items){const cell=document.createElement('div');cell.className='slot';cell.innerHTML=`<div class="icon"><img alt="" src="${item.file}"></div><span>${item.name}</span>`;document.querySelector('#'+target).append(cell)}for(const item of items){const cell=document.createElement('div');cell.className='panel';cell.innerHTML=`<img alt="" src="${item.file}"><strong>${item.name}</strong><p>${item.effect}</p>`;document.querySelector('#detail').append(cell)}</script></html>
