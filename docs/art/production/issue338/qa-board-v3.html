<!doctype html><html lang="ja"><meta charset="utf-8"><title>#338 意味QA</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dce8eb;color:#18364a;font:12px system-ui,sans-serif}.page{width:var(--w);padding:18px}h1{font-size:19px;margin:0 0 8px}h2{font-size:14px;margin:15px 0 6px}.row{display:flex;gap:7px;margin-bottom:7px}.card{width:var(--cw);height:var(--ch);flex:none;background:#f5f5ee;border:2px solid #537487;border-radius:8px;padding:5px;overflow:hidden}.name{height:23px;font-weight:700;font-size:12px;white-space:nowrap}.art{width:var(--aw);height:var(--ah);display:block;object-fit:cover;margin:0 auto}.effect{border-top:1px solid #a7bac1;margin-top:5px;padding-top:4px;font-size:11px;line-height:1.2}.id{font-size:9px;margin-top:3px}.thumbs{display:flex;gap:12px}.thumb{width:68px;text-align:center;font-size:9px}.thumb img{width:48px;height:48px;display:block;object-fit:cover;margin:0 auto 2px}.art-only .name,.art-only .effect,.art-only .id{visibility:hidden}.text-only img{visibility:hidden}.gray img{filter:grayscale(1)}.note{font-size:10px}</style>
<div class="page"><h1>#338 第7波10枚の実寸意味QA</h1><div class="note">2D紙地ガッシュの線・影・彩度・視点・余白と、行為/効果の意味分担。候補未採用。</div><div id="rows"></div></div>
<script>const data=[{"id":"BASE-019","name":"barrier","effect":"毎ターン防御3","image":"assets/card-base-barrier-v1.png"},{"id":"BASE-020","name":"focus","effect":"毎ターン筋力+1","image":"assets/card-base-focus-v1.png"},{"id":"BASE-021","name":"sacrifice","effect":"HP3を払い2枚ドロー","image":"assets/card-base-sacrifice-v1.png"},{"id":"BASE-022","name":"finish","effect":"敵HP半分以下で16ダメージ、通常8","image":"assets/card-base-finish-v3.png"},{"id":"BASE-024","name":"shield break","effect":"敵の防御をすべて除く","image":"assets/card-base-shield-break-v1.png"},{"id":"LIT-010","name":"bookmark","effect":"捨て札1枚回収・時間+0.5秒","image":"assets/card-lit-bookmark-v1.png"},{"id":"SCI-011","name":"test tube","effect":"毒の敵に14、通常7・毒2","image":"assets/card-sci-test-tube-v1.png"},{"id":"KEN-005","name":"kata","effect":"防御5・反撃4","image":"assets/card-ken-kata-v2.png"},{"id":"MUS-009","name":"pickup","effect":"2枚ドロー・時間+2秒","image":"assets/card-mus-pickup-v1.png"},{"id":"ART-010","name":"palette","effect":"手札1枚複製・時間+0.5秒","image":"assets/card-art-palette-v1.png"}];for(const mode of ['normal','art-only','text-only','gray']){const s=document.createElement('section');s.className=mode;s.innerHTML='<h2>'+mode+'</h2><div class="row"></div><div class="row"></div><div class="thumbs"></div>';data.forEach((x,i)=>{const c=document.createElement('div');c.className='card';c.innerHTML='<div class="name">'+x.name+'</div><img class="art" src="'+x.image+'"><div class="effect">'+x.effect+'</div><div class="id">'+x.id+'</div>';s.querySelectorAll('.row')[Math.floor(i/5)].append(c);const t=document.createElement('div');t.className='thumb';t.innerHTML='<img src="'+x.image+'">'+x.id;s.querySelector('.thumbs').append(t)});document.querySelector('#rows').append(s)}</script></html>
