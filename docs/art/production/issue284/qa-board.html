<!doctype html><html lang="ja"><meta charset="utf-8"><title>#284 fourth-wave actual card size QA</title>
<style>*{box-sizing:border-box}body{margin:0;background:#1d3045;color:#f4f6f8;font:12px system-ui,sans-serif}.board{width:1024px;min-height:980px;padding:18px 24px;background:linear-gradient(#263e56,#1d3045)}h1{font-size:18px;margin:0 0 10px}h2{font-size:14px;margin:16px 0 8px;color:#cce4e9}.note{color:#d0dce6;margin:4px 0 12px}.row{display:flex;gap:12px;align-items:flex-start}.card{width:140px;height:160px;flex:none;background:#e7eef2;border:2px solid #435e72;border-radius:8px;color:#172d3f;box-shadow:0 3px 8px #071a2a88;overflow:hidden}.top{height:25px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:12px;font-weight:700}.type{font-size:10px;opacity:.8}.card img{display:block;width:112px;height:57px;object-fit:cover;margin:0 auto;border:1px solid #8eabba}.effect{font-size:12px;line-height:1.2;margin:4px 5px 0;padding:3px 2px;border-top:1px solid #9fb2c0}.id{font-size:9px;color:#426073;text-align:right;padding-right:5px}.reward .card{width:165px;height:220px}.reward .top{height:30px;font-size:14px}.reward .card img{width:135px;height:91px}.thumbs{display:flex;gap:18px;flex-wrap:wrap}.thumb{text-align:center;width:68px;font-size:10px}.thumb img{width:48px;height:48px;object-fit:cover;border:1px solid #a9c8d0;display:block;margin:0 auto 3px}@media(min-width:1200px){.board{width:1440px;min-height:1100px}.card{width:170px;height:160px}.card img{width:145px;height:57px}.reward .card{width:220px;height:270px}.reward .card img{width:190px;height:100px}.reward .effect{font-size:13px}}</style>
<div class="board"><h1>#284 第4波 候補原画 — #261レール実寸監査</h1><p class="note">iPad手札140×160／絵112×57、PC手札170×160／絵145×57、効果12px。絵にレアリティを含めない。</p><h2>手札候補 1</h2><div id="hand-a" class="row"></div><h2>手札候補 2</h2><div id="hand-b" class="row"></div><h2>報酬表示</h2><div id="reward" class="row reward"></div><h2>48pxシルエット</h2><div id="thumbs" class="thumbs"></div><p class="note">静止監査用の仮枠。実ゲーム・正式採用の合格ではない。</p></div>
<script>const cards=[
{id:'BASE-016',name:'duplicate',type:'技能',effect:'手札を1枚複製。',file:'card-base-duplicate-v1.png'},
{id:'BASE-017',name:'boost',type:'技能',effect:'時間+2秒。',file:'card-base-boost-v2.png'},
{id:'KEN-004',name:'riposte',type:'攻撃',effect:'3ダメージ×2回。',file:'card-ken-riposte-v1.png'},
{id:'MUS-004',name:'sync',type:'技能',effect:'2枚引く。時間+1秒。',file:'card-mus-sync-v1.png'},
{id:'ART-006',name:'mural',type:'技能',effect:'全体6ダメージ。毎ターン防御2。',file:'card-art-mural-v2.png'},
{id:'LIT-006',name:'proof',type:'攻撃',effect:'10ダメージ。防御3。',file:'card-lit-proof-v1.png'},
{id:'SCI-005',name:'distill',type:'技能',effect:'毒5。HP2回復。',file:'card-sci-distill-v1.png'},
{id:'SCI-006',name:'quarantine',type:'技能',effect:'防御10。1枚引く。',file:'card-sci-quarantine-v1.png'},
{id:'MUS-006',name:'crescendo',type:'攻撃',effect:'3ダメージ×3回。時間+2秒。',file:'card-mus-crescendo-v1.png'},
{id:'ART-008',name:'layer',type:'技能',effect:'防御5。毎ターン防御1。',file:'card-art-layer-v1.png'}];function card(c){const e=document.createElement('div');e.className='card';e.innerHTML=`<div class="top"><span>${c.name}</span><span class="type">${c.type}</span></div><img alt="" src="assets/${c.file}"><div class="effect">${c.effect}</div><div class="id">${c.id}</div>`;return e}cards.slice(0,5).forEach(c=>document.querySelector('#hand-a').append(card(c)));cards.slice(5).forEach(c=>document.querySelector('#hand-b').append(card(c)));[cards[0],cards[5],cards[8]].forEach(c=>document.querySelector('#reward').append(card(c)));cards.forEach(c=>{const e=document.createElement('div');e.className='thumb';e.innerHTML=`<img alt="" src="assets/${c.file}">${c.id}`;document.querySelector('#thumbs').append(e)})</script></html>
