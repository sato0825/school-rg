<!doctype html><html lang="ja"><meta charset="utf-8"><title>#314 first club-action meaning QA</title>
<style>*{box-sizing:border-box}body{margin:0;background:#1d3045;color:#f4f6f8;font:12px system-ui,sans-serif}.board{width:1024px;min-height:980px;padding:18px 24px;background:linear-gradient(#263e56,#1d3045)}h1{font-size:18px;margin:0 0 10px}h2{font-size:14px;margin:16px 0 8px;color:#cce4e9}.note{color:#d0dce6;margin:4px 0 12px}.row{display:flex;gap:12px;align-items:flex-start}.card{width:140px;height:160px;flex:none;background:#e7eef2;border:2px solid #435e72;border-radius:8px;color:#172d3f;box-shadow:0 3px 8px #071a2a88;overflow:hidden}.top{height:25px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:12px;font-weight:700}.type{font-size:10px;opacity:.8}.card img{display:block;width:112px;height:57px;object-fit:cover;margin:0 auto;border:1px solid #8eabba}.effect{font-size:12px;line-height:1.2;margin:4px 5px 0;padding:3px 2px;border-top:1px solid #9fb2c0}.id{font-size:9px;color:#426073;text-align:right;padding-right:5px}.reward .card{width:165px;height:220px}.reward .top{height:30px;font-size:14px}.reward .card img{width:135px;height:91px}.art-only .card .top,.art-only .card .effect,.art-only .card .id{visibility:hidden}.text-only .card img{visibility:hidden}.thumbs{display:flex;gap:18px;flex-wrap:wrap}.thumb{text-align:center;width:68px;font-size:10px}.thumb img{width:48px;height:48px;object-fit:cover;border:1px solid #a9c8d0;display:block;margin:0 auto 3px}@media(min-width:1200px){.board{width:1440px;min-height:1100px}.card{width:170px;height:160px}.card img{width:145px;height:57px}.reward .card{width:220px;height:270px}.reward .card img{width:190px;height:100px}.reward .effect{font-size:13px}}</style>
<div class="board"><h1>#314 5部活の行為絵 第2群監査</h1><p class="note">iPad手札140×160／絵112×57、PC手札170×160／絵145×57、効果12px。絵にレアリティを含めない。</p><h2>手札候補</h2><div id="hand-a" class="row"></div><h2>別並び</h2><div id="hand-b" class="row"></div><h2>報酬表示</h2><div id="reward" class="row reward"></div><h2>48pxシルエット</h2><div id="thumbs" class="thumbs"></div><p class="note">絵だけで行為の方向、文字で対象・数値を確認する。実ゲーム・正式採用の合格ではない。</p></div>
<script>const cards=[{id:'LIT-012',name:'anthology',type:'攻撃',effect:'敵全体に6ダメージ。1枚引く。',file:'card-lit-anthology-v1.png'},{id:'SCI-010',name:'culture',type:'技能',effect:'毒4。毎ターン防御1。',file:'card-sci-culture-v1.png'},{id:'KEN-008',name:'breath',type:'技能',effect:'防御4。反撃3。1枚引く。',file:'card-ken-breath-v1.png'},{id:'MUS-008',name:'refrain',type:'攻撃',effect:'敵全体に4ダメージ。時間+2秒。',file:'card-mus-refrain-v1.png'},{id:'ART-009',name:'primer',type:'能力',effect:'毎ターン防御2。1枚引く。',file:'card-art-primer-v1.png'}];function card(c){const e=document.createElement('div');e.className='card';e.innerHTML=`<div class="top"><span>${c.name}</span><span class="type">${c.type}</span></div><img alt="" src="assets/${c.file}"><div class="effect">${c.effect}</div><div class="id">${c.id}</div>`;return e}cards.slice(0,3).forEach(c=>document.querySelector('#hand-a').append(card(c)));cards.slice(3).forEach(c=>document.querySelector('#hand-b').append(card(c)));[cards[0],cards[2],cards[4]].forEach(c=>document.querySelector('#reward').append(card(c)));cards.forEach(c=>{const e=document.createElement('div');e.className='thumb';e.innerHTML=`<img alt="" src="assets/${c.file}">${c.id}`;document.querySelector('#thumbs').append(e)})</script></html>
