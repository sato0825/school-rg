<!doctype html><html lang="ja"><meta charset="utf-8"><title>#269 v1 v2 comparison</title>
<style>*{box-sizing:border-box}body{margin:0;background:#21364c;color:#f3f6f8;font:12px system-ui,sans-serif}.board{width:1024px;min-height:800px;padding:18px 24px}h1{font-size:18px;margin:0 0 12px}.row{display:flex;align-items:center;gap:12px;margin:0 0 18px}.label{width:76px;font-weight:700}.card{background:#e7eef2;color:#172d3f;border:2px solid #435e72;border-radius:9px;width:133px;height:180px;padding:6px;flex:none}.card b{font-size:12px}.card img{display:block;width:113px;height:57px;object-fit:cover;margin:8px 0}.card span{font-size:11px}.thumb{margin:0 8px;color:#dce9ef}.thumb img{display:block;width:48px;height:48px;object-fit:cover;border:1px solid #a9c8d0}.note{color:#c6d6df}</style>
<div class="board"><h1>#269 4枚のv1/v2縮小比較</h1><p class="note">カード133×180、絵113×57、右の画像48×48。レアリティ・正式採用は未決定。</p><div id="rows"></div></div>
<script>const cards=[['LIT-005','reread','card-lit-reread'],['SCI-009','buffer','card-sci-buffer'],['KEN-011','hasso','card-ken-hasso'],['ART-005','redraw','card-art-redraw']];for(const [id,name,stem] of cards){const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="label">${id}<br>${name}</div><div class="card"><b>v1</b><img alt="" src="assets/${stem}-v1.png"><span>初稿</span></div><div class="card"><b>v2</b><img alt="" src="assets/${stem}-v2.png"><span>再制作</span></div><div class="thumb"><img alt="" src="assets/${stem}-v1.png">v1 48px</div><div class="thumb"><img alt="" src="assets/${stem}-v2.png">v2 48px</div>`;document.querySelector('#rows').append(row)}</script></html>
