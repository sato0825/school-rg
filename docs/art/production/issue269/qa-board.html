<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>#269 hand and reward art QA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1d3045;color:#f3f5f8;font:12px system-ui,sans-serif}.board{width:1024px;min-height:1100px;padding:18px 24px;background:linear-gradient(#263e56,#1d3045)}h1{font-size:18px;margin:0 0 12px}h2{font-size:14px;margin:16px 0 8px;color:#cce4e9}.note{color:#d0dce6;margin:4px 0 12px}.row{display:flex;gap:12px;align-items:flex-start}.card{width:133px;height:180px;flex:none;background:#e7eef2;border:2px solid #435e72;border-radius:9px;color:#172d3f;box-shadow:0 3px 8px #071a2a88;overflow:hidden}.card .top{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-weight:700;font-size:12px}.card .type{font-size:10px;opacity:.8}.card img{display:block;width:113px;height:57px;object-fit:cover;margin:0 auto;border:1px solid #8eabba}.card .effect{font-size:11px;line-height:1.3;margin:6px;padding:4px 3px;border-top:1px solid #9fb2c0;min-height:46px}.card .id{font-size:9px;color:#426073;text-align:right;padding-right:6px}.reward .card{width:165px;height:220px}.reward .card .top{height:30px;font-size:14px}.reward .card img{width:135px;height:91px}.reward .card .effect{font-size:12px;min-height:54px}.thumbs{display:flex;gap:18px;flex-wrap:wrap}.thumb{text-align:center;width:68px;font-size:10px}.thumb img{width:48px;height:48px;object-fit:cover;border-radius:5px;border:1px solid #a9c8d0;display:block;margin:0 auto 3px}.footer{font-size:10px;color:#bed1dc;margin:16px 0 0}
@media(min-width:1200px){.board{width:1440px;min-height:1250px}.card{width:166px;height:204px}.card .top{height:30px;font-size:14px}.card img{width:144px;height:67px}.card .effect{font-size:12px;min-height:58px}.reward .card{width:220px;height:270px}.reward .card img{width:190px;height:100px}.reward .card .effect{font-size:13px}}
</style><div class="board"><h1>#269 第二波カード候補 — 実寸表示監査</h1><p class="note">iPad手札133×180px／絵113×57px。報酬165×220px／絵135×91px。レアリティ未設定。表示内のレイアウトは監査用仮枠。</p><h2>戦闘手札・文学／科学</h2><div id="hand-a" class="row"></div><h2>戦闘手札・剣道／音楽／美術</h2><div id="hand-b" class="row"></div><h2>報酬3択</h2><div id="reward" class="row reward"></div><h2>48px識別</h2><div id="thumbs" class="thumbs"></div><p class="footer">効果文は意味確認用。最終UI、正式採用、レアリティ表現を示すものではありません。</p></div>
<script>
const cards=[
 {id:'LIT-005',name:'reread',type:'技能',effect:'捨て札から1枚戻す。防御2。',file:'card-lit-reread-v1.png'},
 {id:'LIT-009',name:'edit',type:'技能',effect:'手札を1枚除外し、2枚引く。',file:'card-lit-edit-v1.png'},
 {id:'SCI-007',name:'catalyst',type:'技能',effect:'毒2と弱体1ターンを付与。',file:'card-sci-catalyst-v1.png'},
 {id:'SCI-009',name:'buffer',type:'技能',effect:'防御6。弱体効果を1つ解除。',file:'card-sci-buffer-v1.png'},
 {id:'KEN-009',name:'guard step',type:'技能',effect:'防御5。入力時間を1秒追加。',file:'card-ken-guard-step-v1.png'},
 {id:'KEN-011',name:'hasso',type:'能力',effect:'毎ターン筋力+1。防御4。',file:'card-ken-hasso-v1.png'},
 {id:'MUS-005',name:'chorus',type:'攻撃',effect:'敵全体に5ダメージ。時間+1秒。',file:'card-mus-chorus-v1.png'},
 {id:'MUS-010',name:'riff',type:'攻撃',effect:'2ダメージ×4回。1枚引く。',file:'card-mus-riff-v1.png'},
 {id:'ART-005',name:'redraw',type:'技能',effect:'手札をmuralへ変化。防御3。',file:'card-art-redraw-v1.png'},
 {id:'ART-012',name:'triptych',type:'攻撃',effect:'敵全体に7。毎ターン防御+1。',file:'card-art-triptych-v1.png'}
];
function card(c){const e=document.createElement('div');e.className='card';e.innerHTML=`<div class="top"><span>${c.name}</span><span class="type">${c.type}</span></div><img alt="" src="assets/${c.file}"><div class="effect">${c.effect}</div><div class="id">${c.id}</div>`;return e}
cards.slice(0,5).forEach(c=>document.querySelector('#hand-a').append(card(c)));
cards.slice(5).forEach(c=>document.querySelector('#hand-b').append(card(c)));
[cards[0],cards[6],cards[9]].forEach(c=>document.querySelector('#reward').append(card(c)));
cards.forEach(c=>{const e=document.createElement('div');e.className='thumb';e.innerHTML=`<img alt="" src="assets/${c.file}">${c.id}`;document.querySelector('#thumbs').append(e)});
</script></html>
