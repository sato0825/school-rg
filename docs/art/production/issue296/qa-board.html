<!doctype html><html lang="ja"><meta charset="utf-8"><title>#296 outline style QA</title>
<style>*{box-sizing:border-box}body{margin:0;background:#1d3045;color:#f4f6f8;font:12px system-ui,sans-serif}.board{width:1024px;min-height:970px;padding:18px 24px;background:linear-gradient(#263e56,#1d3045)}h1{font-size:18px;margin:0 0 8px}h2{font-size:14px;margin:16px 0 8px;color:#cce4e9}.note{color:#d0dce6;margin:4px 0 12px}.row{display:flex;gap:12px;align-items:flex-start}.card{width:140px;height:160px;flex:none;background:#e7eef2;border:2px solid #435e72;border-radius:8px;color:#172d3f;box-shadow:0 3px 8px #071a2a88;overflow:hidden}.top{height:25px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:12px;font-weight:700}.type{font-size:10px;opacity:.8}.card img{display:block;width:112px;height:57px;object-fit:cover;margin:0 auto;border:1px solid #8eabba}.effect{font-size:12px;line-height:1.2;margin:4px 5px 0;padding:3px 2px;border-top:1px solid #9fb2c0}.tag{font-size:9px;color:#426073;text-align:right;padding-right:5px}.reward .card{width:165px;height:220px}.reward .top{height:30px;font-size:14px}.reward .card img{width:135px;height:91px}.thumbs{display:flex;gap:20px}.thumb{text-align:center;width:70px;font-size:10px}.thumb img{width:48px;height:48px;object-fit:cover;border:1px solid #a9c8d0;display:block;margin:0 auto 3px}@media(min-width:1200px){.board{width:1440px}.card{width:170px}.card img{width:145px}.reward .card{width:220px;height:270px}.reward .card img{width:190px;height:100px}}</style>
<div class="board"><h1>#296 文芸部 outline 質感改稿</h1><p class="note">同じ手札の候補絵と並べ、窓際机の写実陰影を紙地ガッシュへ揃える。</p><h2>旧候補を含む手札</h2><div id="before" class="row"></div><h2>改稿候補を含む手札</h2><div id="after" class="row"></div><h2>報酬サイズ比較</h2><div id="reward" class="row reward"></div><h2>48px中央クロップ</h2><div id="thumbs" class="thumbs"></div><p class="note">候補比較。v3の正式採用・本編接続・権利審査は未実施。レアリティは未確定。</p></div>
<script>const cards=[{name:'heavy strike',type:'攻撃',effect:'敵1体に9ダメージ。',file:'../issue275/assets/card-base-heavy-strike-v2.png',tag:'共通'},{name:'verse',type:'攻撃',effect:'敵1体に6ダメージ。',file:'reference/card-verse-candidate-v1.png',tag:'文芸'},{name:'draw',type:'技能',effect:'2枚引く。',file:'reference/card-draw-candidate-v1.png',tag:'文芸'}];const before={name:'outline',type:'技能',effect:'2枚引く。時間+1秒。',file:'reference/card-outline-candidate-v1.png',tag:'旧 v1'};const after={...before,file:'assets/card-lit-outline-v3.png',tag:'改稿 v3'};function card(c){const e=document.createElement('div');e.className='card';e.innerHTML=`<div class="top"><span>${c.name}</span><span class="type">${c.type}</span></div><img alt="" src="${c.file}"><div class="effect">${c.effect}</div><div class="tag">${c.tag}</div>`;return e}[...cards,before].forEach(c=>document.querySelector('#before').append(card(c)));[...cards,after].forEach(c=>document.querySelector('#after').append(card(c)));[before,after,cards[2]].forEach(c=>document.querySelector('#reward').append(card(c)));[before,after].forEach(c=>{const e=document.createElement('div');e.className='thumb';e.innerHTML=`<img alt="" src="${c.file}">${c.tag}`;document.querySelector('#thumbs').append(e)})</script></html>
