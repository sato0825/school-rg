<style>
*{box-sizing:border-box}html,body{margin:0;background:#172738;color:#e9f2f4;font-family:system-ui,-apple-system,sans-serif}.board{width:100vw;height:100vh;min-height:680px;padding:18px 24px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(#1324389c,#132438d9),url(../../../../src/assets/stages/act1-library-entrance-candidate-v1.png) center/cover}.head{height:52px;flex:none;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #a6bbc46e}.head h1{font-size:19px;margin:0}.head small{font-size:11px;color:#d0dee2}.reward{flex:1;display:flex;align-items:center;justify-content:center;gap:20px}.group-label{font-size:11px;letter-spacing:.12em;color:#d1e2e7;font-weight:750}.card{background:#f4f5f0;color:#20384d;border:3px solid #a3b6bb;box-shadow:0 9px 20px #091522af;display:flex;flex-direction:column;gap:4px;padding:6px;width:190px;height:228px;min-width:0}.card .word{font:800 19px/1.1 ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .tag{font-size:9px;color:#527388}.card img{width:100%;height:119px;object-fit:cover;object-position:center;border:1px solid #a9bfc6;background:#dce7ed}.card .effect{font-size:11px;font-weight:750;line-height:1.3;flex:1}.hand-area{height:180px;flex:none;border-top:1px solid #bed1d675;padding-top:8px;background:#173045b8}.hand{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}.hand .card{width:118px;height:113px;padding:3px;gap:2px;border-width:2px;box-shadow:0 4px 8px #091522a0}.hand .card .word{font-size:12px}.hand .card .tag{display:none}.hand .card img{height:56px}.hand .card .effect{font-size:8px;line-height:1.1;overflow:hidden}.foot{height:44px;flex:none;font-size:11px;line-height:1.4;color:#d1e3e9}.swatch{display:flex;gap:12px}.swatch span{background:#e8f1f4;padding:3px 7px;color:#284858;border-radius:3px;font-size:10px}.gray{filter:grayscale(1)}.quiet{filter:saturate(.55)}@media(max-width:1100px){.board{padding:12px <main class="board" id="board"><header class="head"><h1>5部活のカード絵 · 実寸診断</h1><small>Issue #255 · 候補画像 / 正式 rarity 未定義</small></header><section class="reward"><div><div class="group-label">報酬 3 枚 · 190×228 px</div><div class="swatch" id="reward"></div></div></section><section class="hand-area"><div class="group-label">縮小手札 5 枚 · 現行 118×113 px 相当</div><div class="hand" id="hand"></div></section><footer class="foot">診断用の静的配置です。ゲームの操作、選択状態、カード発動、iPad実機、正式アセット採用の合格証拠ではありません。各カードの絵・入力語・効果が同時に識別できるかを比較します。</footer></main>
<script>
const data=[
 {id:'LIT-002',word:'leaf',club:'文芸',effect:'防御 4 · 1枚引く',file:'card-lit-leaf-v1.png'},
 {id:'SCI-001',word:'sample',club:'科学',effect:'毒 3 · 1枚引く',file:'card-sci-sample-v1.png'},
 {id:'KEN-001',word:'parry',club:'剣道',effect:'防御 6 · 反撃 2',file:'card-ken-parry-v2.png'},
 {id:'MUS-001',word:'tempo',club:'軽音',effect:'時間 +2秒 · 1枚引く',file:'card-mus-tempo-v1.png'},
 {id:'ART-002',word:'frame',club:'美術',effect:'防御 7 · 保持',file:'card-art-frame-v1.png'},
];
function card(d){return `<article class="card" data-id="${d.id}"><div class="word">${d.word}</div><div class="tag">${d.club} · ${d.id}</div><img src="assets/${d.file}" alt=""><div class="effect">${d.effect}</div></article>`}
document.getElementById('reward').innerHTML=data.slice(0,3).map(card).join('');document.getElementById('hand').innerHTML=data.map(card).join('');const q=new URLSearchParams(location.search);if(q.has('gray'))document.getElementById('board').classList.add('gray');if(q.has('quiet'))document.getElementById('board').classList.add('quiet');
</script></html>
