<!doctype html><html lang="ja"><meta charset="utf-8"><title>#338 意味QA</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dce8eb;color:#18364a;font:12px system-ui,sans-serif}.page{width:var(--w);padding:18px}h1{font-size:19px;margin:0 0 8px}h2{font-size:14px;margin:15px 0 6px}.row{display:flex;gap:7px;margin-bottom:7px}.card{width:var(--cw);height:var(--ch);flex:none;background:#f5f5ee;border:2px solid #537487;border-radius:8px;padding:5px;overflow:hidden}.name{height:23px;font-weight:700;font-size:12px;white-space:nowrap}.art{width:var(--aw);height:var(--ah);display:block;object-fit:cover;margin:0 auto}.effect{border-top:1px solid #a7bac1;margin-top:5px;padding-top:4px;font-size:11px;line-height:1.2}.id{font-size:9px;margin-top:3px}.thumbs{display:flex;gap:12px}.thumb{width:68px;text-align:center;font-size:9px}.thumb img{width:48px;height:48px;display:block;object-fit:cover;margin:0 auto 2px}.art-only .name,.art-only .effect,.art-only .id{visibility:hidden}.text-only img{visibility:hidden}.gray img{filter:grayscale(1)}.note{font-size:10px}</style>
<div class="page"><h1>#377 最終8枚の実寸意味QA</h1><div class="note">2D紙地ガッシュの線・影・彩度・視点・余白と、行為/効果の意味分担。候補未採用。</div><div id="rows"></div></div>
<script>const data=[{"id":"LIT-008","name":"footnote","effect":"防御4・2枚ドロー","image":"assets/card-lit-008-footnote-v1.png"},{"id":"LIT-011","name":"draft","effect":"敵に3ダメージ・2枚ドロー","image":"assets/card-lit-011-draft-v2.png"},{"id":"SCI-012","name":"neutralize","effect":"敵に弱体2・毒2・1枚ドロー","image":"assets/card-sci-012-neutralize-v1.png"},{"id":"KEN-010","name":"pommel","effect":"敵に6ダメージ・防御5","image":"assets/card-ken-010-pommel-v1.png"},{"id":"KEN-012","name":"circle cut","effect":"敵全体に6ダメージ・反撃2","image":"assets/card-ken-012-circle-cut-v1.png"},{"id":"MUS-011","name":"backbeat","effect":"防御5・時間+3秒","image":"assets/card-mus-011-backbeat-v2.png"},{"id":"MUS-012","name":"finale","effect":"敵全体に8ダメージ・時間+1秒・除外","image":"assets/card-mus-012-finale-v1.png"},{"id":"ART-011","name":"cutout","effect":"手札1枚除外・防御8","image":"assets/card-art-011-cutout-v1.png"}];for(const mode of ['normal','art-only','text-only','gray']){const s=document.createElement('section');s.className=mode;s.innerHTML='<h2>'+mode+'</h2><div class="row"></div><div class="row"></div><div class="thumbs"></div>';data.forEach((x,i)=>{const c=document.createElement('div');c.className='card';c.innerHTML='<div class="name">'+x.name+'</div><img class="art" src="'+x.image+'"><div class="effect">'+x.effect+'</div><div class="id">'+x.id+'</div>';s.querySelectorAll('.row')[Math.floor(i/5)].append(c);const t=document.createElement('div');t.className='thumb';t.innerHTML='<img src="'+x.image+'">'+x.id;s.querySelector('.thumbs').append(t)});document.querySelector('#rows').append(s)}</script></html>
