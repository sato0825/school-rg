<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>Issue 304 地点小物候補の実寸合成</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #172838; }
.stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: url('../../../../src/assets/stages/act1-paper-atrium-candidate-v1.png') center center / cover no-repeat; }
.stage::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(21,42,58,.12), transparent 42%, rgba(15,35,50,.08)); pointer-events: none; }
.hero { position: absolute; z-index: 2; left: 8%; bottom: 6%; height: 68%; width: 26%; object-fit: contain; object-position: bottom; filter: drop-shadow(2px 14px 12px rgba(15,28,46,.25)); }
.prop { position: absolute; z-index: 1; right: 14%; bottom: 6%; height: 62%; width: 40%; object-fit: contain; object-position: bottom center; filter: drop-shadow(2px 14px 12px rgba(15,28,46,.21)); }
.stage[data-place="shop"] .prop { right: 8%; width: 48%; height: 60%; }
.stage[data-place="rest"] .prop { right: 8%; width: 50%; height: 49%; }
.stage[data-place="event"] .prop { right: 12%; width: 42%; height: 64%; }
@media (max-width: 1100px) {
 .hero { left: 4%; height: 62%; width: 32%; }
 .prop { right: 7%; width: 51%; height: 60%; }
 .stage[data-place="shop"] .prop { right: 3%; width: 55%; height: 57%; }
 .stage[data-place="rest"] .prop { right: 3%; width: 57%; height: 46%; }
 .stage[data-place="event"] .prop { right: 6%; width: 50%; height: 61%; }
}
</style>
<main class="stage"><img class="hero" src="../../candidates/literature-idle-candidate-v1.png" alt="文芸部の人物候補"><img class="prop" alt="地点小物候補"></main>
<script>
const place = new URLSearchParams(location.search).get('place') || 'archive';
const act = new URLSearchParams(location.search).get('act') || '1';
const files = { archive: 'archive-locker', shop: 'school-shop', rest: 'rest-bench', event: 'event-board' };
document.querySelector('.stage').dataset.place = place;
if (act === '3') document.querySelector('.stage').style.backgroundImage = "url('../../../../src/assets/stages/act3-paper-auditorium-foyer-candidate-v1.png')";
document.querySelector('.prop').src = `../../../../src/assets/locations/issue304/${files[place]}-candidate-v1.png`;
</script>
</html>
