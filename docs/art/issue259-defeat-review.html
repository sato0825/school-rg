<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>#259 敗北ポーズ同一人物・縮尺比較</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;background:#d6e0e1;color:#1a3443}
  main{display:grid;grid-template-rows:58px minmax(0,1fr) 56px;width:100vw;height:100vh;background:linear-gradient(180deg,#dbe6e6,#c3d2d6)}
  header,footer{display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:#f3f4ec;border-bottom:1px solid #b4c4c6;font-size:15px}
  footer{border-top:1px solid #b4c4c6;border-bottom:0;font-size:12px;color:#4e6670}
  h1{margin:0;font-size:18px}strong{font-weight:800}
  .club{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px 20px 0;min-height:0}
  .pose{position:relative;overflow:hidden;min-height:0;border:1px solid #8caab2;background:linear-gradient(180deg,#e8f0ed,#d7e3e0 62%,#aec3c9)}
  .pose::after{content:"";position:absolute;left:0;right:0;bottom:49px;height:1px;background:#648b9a7d;z-index:1}
  .pose h2{position:absolute;left:14px;top:9px;z-index:3;margin:0;font-size:16px}
  .pose small{position:absolute;left:14px;top:37px;z-index:3;font-size:11px;color:#4f6d78}
  .pose img{position:absolute;bottom:35px;left:50%;z-index:2;transform:translateX(-50%);height:min(76%,620px);max-width:98%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 7px #4462724b)}
  .pose.defeat img{bottom:20px;height:min(61%,500px)}
  .floor{position:absolute;bottom:0;width:100%;height:50px;background:#a7bfc6;z-index:0}
  [hidden]{display:none!important}
  @media(max-width:1100px){main{grid-template-rows:52px minmax(0,1fr) 52px}.club{padding:8px 8px 0;gap:4px}.pose img{height:74%}.pose.defeat img{height:60%}header,footer{padding:0 12px}h1{font-size:15px}}
</style>
<main>
  <header><h1>#259 敗北ポーズ比較 <strong id="club-name">剣道部</strong></h1><span>候補 · 未採用</span></header>
  <section class="club" id="club">
    <div class="pose"><h2>待機</h2><small>既存の人物基準</small><img id="idle" alt="待機ポーズ"><span class="floor"></span></div>
    <div class="pose"><h2>被弾</h2><small>既存の人物基準</small><img id="hit" alt="被弾ポーズ"><span class="floor"></span></div>
    <div class="pose defeat"><h2>敗北</h2><small>今回の座り込み候補</small><img id="defeat" alt="座り込み敗北ポーズ"><span class="floor"></span></div>
  </section>
  <footer><span>同じ床線に配置。人物比率・顔・服・小物・手足の整合を目視確認する。</span><span>1024×1536 PNG · 透明</span></footer>
</main>
<script>
  const data={
    kendo:{name:'剣道部',idle:'kendo-idle-candidate-v1.png',hit:'kendo-hit-candidate-v2.png',defeat:'kendo-defeat-candidate-v1.png'},
    music:{name:'軽音部',idle:'music-idle-candidate-v1.png',hit:'music-hit-candidate-v2.png',defeat:'music-defeat-candidate-v1.png'},
    art:{name:'美術部',idle:'art-idle-candidate-v1.png',hit:'art-hit-candidate-v3.png',defeat:'art-defeat-candidate-v1.png'}
  };
  const club=data[new URLSearchParams(location.search).get('club')]??data.kendo;
  document.querySelector('#club-name').textContent=club.name;
  for(const key of ['idle','hit','defeat'])document.querySelector(`#${key}`).src=`candidates/${club[key]}`;
</script>
</html>
